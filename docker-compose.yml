# generated by squadctl from the Dockerfiles of this project and the squad's stack packs.
# It is the file the squad started (docker compose up --wait) to validate the task: it is
# regenerated on every task. Delete this first line to take ownership of it.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./back-end
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/app
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongodata:
